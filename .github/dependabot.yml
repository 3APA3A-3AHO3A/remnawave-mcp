# Бот каждый день проверяет новые версии зависимостей и открывает PR.
# Контракт Remnawave и zod он НЕ трогает: их обновляет workflow panel-release.yml —
# только под стабильный релиз панели, а не под промежуточные сборки.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@remnawave/backend-contract"
      - dependency-name: "zod"
    groups:
      mcp-sdk:
        patterns: ["@modelcontextprotocol/sdk"]
      dev:
        dependency-type: development
  # инструменты сборки на GitHub: раз в неделю и ОДНИМ общим PR —
  # они правят одни и те же файлы, отдельные PR конфликтовали бы друг с другом
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
