name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # проверка, что инструменты собираются из контракта
      - run: npm run list-tools:all
      # тесты: приватность (ничего не утекает), отчёты, ограничения
      - run: npm test
      # известные уязвимости в зависимостях, которые попадают к пользователю
      - run: npm audit --omit=dev --audit-level=high
      # расширение Claude собирается
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: remnawave-mcp-mcpb
          path: build/*.mcpb
          retention-days: 7
