name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # проверка, что инструменты собираются из контракта
      - run: npm run list-tools:all
      # тесты: приватность (ничего не утекает), отчёты, ограничения
      - run: npm test
      # известные уязвимости в зависимостях, которые попадают к пользователю
      - run: npm audit --omit=dev --audit-level=high
      # расширение Claude собирается
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: remnawave-mcp-mcpb
          path: build/*.mcpb
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # те же действия и настройки, что при релизе (без публикации) — так обновления этих действий
      # от Dependabot проверяются в PR, а не всплывают только на релизе
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Собрать образ для amd64 и arm64, как при релизе
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: CONTRACT_VERSION=3.3.3
      - name: Собрать образ для проверки запуска
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: remnawave-mcp:ci
      - name: Образ запускается, строит команды из контракта и работает не от root
        run: |
          docker run --rm remnawave-mcp:ci --version
          docker run --rm remnawave-mcp:ci --list-tools | tail -1
          test "$(docker run --rm --entrypoint id remnawave-mcp:ci -u)" != "0"
