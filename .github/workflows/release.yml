# Два способа выпустить релиз — оба работают:
#  1) на сайте: Releases → Draft a new release → тег vX.Y.Z → текст → Publish;
#  2) из консоли: git tag vX.Y.Z && git push origin vX.Y.Z (текст возьмётся из CHANGELOG.md).
# В обоих случаях workflow собирает проект, прогоняет тесты и прикладывает к релизу
# файлы расширения под каждую версию панели 3.x. Написанный на сайте текст не трогается;
# если текст пустой — подставляется раздел из CHANGELOG.md и инструкция по установке.
name: Release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write
  packages: write

# релиз с сайта создаёт и тег, и релиз — два запуска идут по очереди, второй просто обновит файлы
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Версия тега = версия в package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then echo "Тег $TAG, а в package.json $PKG — поправьте версию"; exit 1; fi

      # по файлу на каждую версию панели 3.x: remnawave-3.0.mcpb … remnawave-3.4.mcpb
      - run: npm run pack:mcpb -- --all

      - name: Текст из CHANGELOG
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          # версии панели и имя образа берутся из проекта, а не вписаны руками
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          T=$(node scripts/build-mcpb.mjs --print-targets)
          STABLE=$(node -e "console.log(JSON.parse(process.argv[1]).find(t=>t.latest).minor)" "$T")
          ALL=$(node -e "console.log(JSON.parse(process.argv[1]).map(t=>t.minor).reverse().join(', '))" "$T")
          {
            echo
            echo '---'
            echo "**Claude Desktop:** скачайте \`remnawave-$STABLE.mcpb\` (или файл под версию своей панели: $ALL) → откройте двойным щелчком → укажите адрес панели и API-токен (только права \`read\`)."
            echo "**Любой другой MCP-клиент:** соберите из исходников или возьмите Docker-образ \`$IMAGE:$STABLE\` (теги: $ALL, latest) и вставьте блок настроек из README, раздел «Подключение к клиентам»."
            echo
            echo "**Claude Desktop:** download \`remnawave-$STABLE.mcpb\` (or the file for your panel version: $ALL) → double-click it → enter the panel URL and an API token (read scopes only)."
            echo "**Any other MCP client:** build from source or use the Docker image \`$IMAGE:$STABLE\` (tags: $ALL, latest) and paste the settings block from README, “Connecting a client”."
          } >> notes.md

      - name: Создать релиз или приложить файлы к существующему
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.mcpb --clobber
            BODY=$(gh release view "$TAG" --json body --jq .body)
            if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then gh release edit "$TAG" --notes-file notes.md; fi
          else
            gh release create "$TAG" build/*.mcpb --title "$TAG" --notes-file notes.md
          fi

  # Docker-образы для Claude Code на сервере: по образу на версию панели 3.x, amd64 + arm64
  docker-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.t.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: t
        run: echo "matrix=$(node scripts/build-mcpb.mjs --print-targets)" >> "$GITHUB_OUTPUT"

  docker:
    needs: [release, docker-targets]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.docker-targets.outputs.matrix) }}
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Теги образа
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          V="${TAG#v}"
          M="${{ matrix.target.minor }}"
          TAGS="$IMAGE:$M,$IMAGE:$M-$V"
          if [ "${{ matrix.target.latest }}" = "true" ]; then TAGS="$TAGS,$IMAGE:latest,$IMAGE:$V"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CONTRACT_VERSION=${{ matrix.target.contract }}
          tags: ${{ steps.tags.outputs.tags }}
